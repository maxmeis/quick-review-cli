name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Build, vet, race tests, strict 100% coverage, and mocked E2E
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/review-e2e
        run: make verify
      - name: Upload terminal transcripts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/review-e2e/
          if-no-files-found: ignore

  standards:
    name: Commit and release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Check all commits introduced since adoption
        # Earlier project history is deliberately grandfathered in.
        run: pnpm exec commitlint --from fc3a39fbf0e1e25786ef8c3b96537c72eeaf74b7 --to HEAD --verbose
      - name: Validate PR title for squash merges
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test hook enforcement, coverage rejection, and SemVer rules
        run: pnpm test
      - name: Build release archives
        run: make dist
      - name: Check release archives
        run: |
          cd dist
          shasum -a 256 -c checksums.txt
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 4
          for archive in *.tar.gz; do
            test "$(tar -tzf "$archive")" = review
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  release:
    name: SemVer release
    needs: [verify, standards]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: semver-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/
      - name: Verify downloaded release assets
        run: cd dist && shasum -a 256 -c checksums.txt
      - name: Publish version, notes, and binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
